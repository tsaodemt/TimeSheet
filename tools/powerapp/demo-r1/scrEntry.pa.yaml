# GENERATED by tools/powerapp/build_demo_app.py — R1 DEMO (provisional wording; R1-Q4 open). Do not edit by hand.
Screens:
  scrEntry:
    Children:
    - lblTitle:
        Control: Label@2.5.1
        Properties:
          Text: =If(IsBlank(varEdit), "New entry", "Edit draft")
          X: =20
          Y: =10
          Width: =600
          Height: =50
          Size: =20
          FontWeight: =FontWeight.Bold
    - lblBusy:
        Control: Label@2.5.1
        Properties:
          Text: =If(varBusy || varSaving, "Working…", "")
          X: =20
          Y: =60
          Width: =400
          Height: =30
    - dpWorkDate:
        Control: Classic/DatePicker@2.6.0
        Properties:
          X: =20
          Y: =100
          Width: =300
          DefaultDate: =If(IsBlank(varEdit), Today(), varEdit.workDate)
          Format: ="dd/mm/yyyy"
    - ddProject:
        Control: Classic/DropDown@2.3.1
        Properties:
          X: =20
          Y: =150
          Width: =400
          Items: =Filter(Projects, Status.Value = "Active")
          Default: =If(IsBlank(varEdit), Blank(), LookUp(Projects, ID = varEdit.projectId, ProjectCode))
          Items.Value: =ProjectCode
    - ddPhase:
        Control: Classic/DropDown@2.3.1
        Properties:
          X: =20
          Y: =200
          Width: =400
          Items: =Filter(Phases, IsActive, ID in ForAll(Filter(ProjectPhases, ProjectItemId = ddProject.Selected.ID, IsActive), Phase.Id))
          Default: =If(IsBlank(varEdit), Blank(), LookUp(Phases, ID = varEdit.phaseId, PhaseCode))
          Items.Value: =PhaseCode
    - ddWorkType:
        Control: Classic/DropDown@2.3.1
        Properties:
          X: =20
          Y: =250
          Width: =400
          Items: =Filter(WorkTypes, IsActive)
          Default: =If(IsBlank(varEdit), Blank(), LookUp(WorkTypes, ID = varEdit.workTypeId, WorkTypeCode))
          Items.Value: =WorkTypeCode
    - ddShift:
        Control: Classic/DropDown@2.3.1
        Properties:
          X: =20
          Y: =300
          Width: =400
          Items: =Filter(Shifts, IsActive)
          Default: =If(IsBlank(varEdit), Blank(), LookUp(Shifts, ID = varEdit.shiftId, ShiftCode))
          Items.Value: =ShiftCode
    - ddHourType:
        Control: Classic/DropDown@2.3.1
        Properties:
          X: =20
          Y: =350
          Width: =400
          Items: =HourTypes
          Default: =If(IsBlank(varEdit), Blank(), LookUp(HourTypes, ID = varEdit.hourTypeId, HourTypeCode))
          Items.Value: =HourTypeCode
    - txtHours:
        Control: Classic/TextInput@2.3.2
        Properties:
          X: =20
          Y: =400
          Width: =200
          Format: =TextFormat.Number
          Default: =If(IsBlank(varEdit), "", Text(varEdit.hours))
          HintText: ="Hours"
    - lblHoursHint:
        Control: Label@2.5.1
        Properties:
          X: =240
          Y: =400
          Width: =500
          Height: =40
          Text: =If(Value(txtHours.Text) > Coalesce(varWarnEntry, 4), "Above the usual maximum per entry — you can still save.", "")
    - txtRemark:
        Control: Classic/TextInput@2.3.2
        Properties:
          X: =20
          Y: =450
          Width: =600
          Mode: =TextMode.MultiLine
          Height: =80
          Default: =If(IsBlank(varEdit), "", varEdit.remark)
          HintText: ="Remark (optional)"
    - btnSave:
        Control: Classic/Button@2.2.0
        Properties:
          Text: =If(varSaving, "Saving…", "Save")
          X: =20
          Y: =550
          DisplayMode: =If(varSaving || IsBlank(ddProject.Selected) || IsBlank(ddPhase.Selected) || IsBlank(ddWorkType.Selected) || IsBlank(ddShift.Selected) || IsBlank(ddHourType.Selected) || IsBlank(txtHours.Text),
            DisplayMode.Disabled, DisplayMode.Edit)
          OnSelect: |-
            =Set(varSaving, true);
            Set(varSave, 'TS-SaveEntry'.Run(If(IsBlank(varEdit), "", Text(varEdit.id)), If(IsBlank(varEdit), "", varEdit.etag),
                Text(dpWorkDate.SelectedDate, "yyyy-mm-dd"), ddProject.Selected.ProjectCode, ddPhase.Selected.PhaseCode,
                ddWorkType.Selected.WorkTypeCode, ddShift.Selected.ShiftCode, ddHourType.Selected.HourTypeCode, txtHours.Text, txtRemark.Text));
            Set(varSaving, false);
            ClearCollect(colWarnings, ForAll(Table(ParseJSON(varSave.warnings)), {w: Text(ThisRecord.Value)}));
            If(varSave.ok = "true",
                // success stays success (AUD-F1 option B): AUDIT_DEGRADED is a warning, never a reason to save again
                Set(varReloadRequired, IsBlank(varSave.etag) || varSave.etag = "");
                Notify(Coalesce(LookUp(colMessages, code = "MSG_OK", text), LookUp(colMessages, code = "MSG_ERROR", text)) & Concat(colWarnings, " " & Coalesce(LookUp(colMessages, code = w, text), LookUp(colMessages, code = "MSG_ERROR", text))) & " (" & varSave.correlationid & ")",
                       If(CountRows(colWarnings) > 0, NotificationType.Warning, NotificationType.Success));
                Set(varEdit, Blank());
                Navigate(scrMyTimesheets, ScreenTransition.None),
                Notify(Coalesce(LookUp(colMessages, code = varSave.messagecode, text), LookUp(colMessages, code = "MSG_ERROR", text)) & " (" & varSave.correlationid & ")", NotificationType.Error);
                If(varSave.resultcode = "CONFLICT", Set(varEdit, Blank()); Navigate(scrMyTimesheets, ScreenTransition.None)))
    - btnCancel:
        Control: Classic/Button@2.2.0
        Properties:
          Text: ="Cancel"
          X: =200
          Y: =550
          DisplayMode: =If(varSaving, DisplayMode.Disabled, DisplayMode.Edit)
          OnSelect: =Set(varEdit, Blank()); Navigate(scrMyTimesheets, ScreenTransition.None)
