            Set(varNextAfter, varRead.nextafterid),
            Notify(Coalesce(LookUp(colMessages, code = varRead.messagecode, text), LookUp(colMessages, code = "MSG_ERROR", text)) & " (" & varRead.correlationid & ")", NotificationType.Error))
        ;

