        Set(varRead, 'TS-ReadOwn'.Run(Text(varFrom, "yyyy-mm-dd"), Text(varTo, "yyyy-mm-dd"), If(IsBlank(varAfter), "", Text(varAfter)), "100", ""));
        Set(varBusy, false);
        If(varRead.ok = "true",
