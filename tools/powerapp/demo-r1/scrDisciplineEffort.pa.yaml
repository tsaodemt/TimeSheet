          Width: =Parent.Width - 720
          Height: =150
          TemplateSize: =70
          Visible: =!IsBlank(varDePid)
        Children:
        - lblDeSumName:
            Control: Label@2.5.1
            Properties:
              X: =0
              Y: =0
              Width: =Parent.TemplateWidth
              Height: =30
              FontWeight: =FontWeight.Bold
              Text: =ThisItem.name & " (" & ThisItem.code & ")"
        - lblDeSumVals:
            Control: Label@2.5.1
            Properties:
              X: =0
              Y: =30
              Width: =Parent.TemplateWidth
              Height: =35
              Text: '=If(ThisItem.cstate = "BLANK", "Trần: chưa có", "Trần: " & If(IsBlank(ThisItem.ceiling), "", Text(Value(ThisItem.ceiling), "#,##0.00")) & " · Còn lại: " & If(IsBlank(ThisItem.remaining),
                "", Text(Value(ThisItem.remaining), "#,##0.00"))) & " · Đã đăng ký: " & If(IsBlank(ThisItem.used), "", Text(Value(ThisItem.used), "#,##0.00")) & " · Thực hiện (đã duyệt): " & If(IsBlank(ThisItem.mds),
                "", Text(Value(ThisItem.mds), "#,##0.00")) & " công (" & If(IsBlank(ThisItem.hours), "", Text(Value(ThisItem.hours), "#,##0.00")) & " giờ)"'
    - lblDeTeam:
        Control: Label@2.5.1
        Properties:
          Text: ="Công đăng ký đã xem được"
          X: =700
          Y: =430
          Width: =400
          Height: =30
          FontWeight: =FontWeight.Bold
          Visible: =!IsBlank(varDePid) && varDeScope <> "self"
    - btnDeApprove:
        Control: Classic/Button@2.2.0
        Properties:
          Text: ="Phê duyệt (" & CountRows(colDeSel) & ")"
          X: =1120
          Y: =425
          Width: =160
          Height: =40
          Visible: =varDeCanApprove && !IsBlank(varDePid)
          DisplayMode: =If(varSaving || varBusy || CountRows(colDeSel) = 0 || CountRows(colDeSel) > 50 || CountRows(Filter(colDeEdit As e, e.t <> Coalesce(LookUp(colDeMine, wt = e.k).value, ""))) > 0, DisplayMode.Disabled,
            DisplayMode.Edit)
          OnSelect: =Set(varDeConfirm, true)
    - lblDeConfirm:
        Control: Label@2.5.1
        Properties:
          Text: =Coalesce(LookUp(colMessages, code = "DE_APPROVE_CONFIRM", text), LookUp(colMessages, code = "MSG_ERROR", text))
          X: =700
          Y: =470
          Width: =440
          Height: =40
          FontWeight: =FontWeight.Bold
          Visible: =varDeConfirm
    - btnDeConfirmYes:
        Control: Classic/Button@2.2.0
        Properties:
          Text: ="Yes"
          X: =1150
          Y: =470
          Width: =80
          Height: =40
          Visible: =varDeConfirm
          DisplayMode: =If(varSaving, DisplayMode.Disabled, DisplayMode.Edit)
          OnSelect: |-
            =Set(varDeConfirm, false);
            Set(varSaving, true);
            Set(varDeAppr, 'EFF-ApproveDisciplineEffort'.Run(JSON(ForAll(colDeSel As x, {itemId: x.id, etag: x.etag}), JSONFormat.Compact), GUID()));
            Set(varSaving, false);
            ClearCollect(colDeApprRes, ForAll(Table(ParseJSON(varDeAppr.results)), {id: Value(ThisRecord.Value.itemId), rc: Text(ThisRecord.Value.resultcode)}));
            Clear(colDeSel);
            Notify(Switch(varDeAppr.resultcode, "OK", Coalesce(LookUp(colMessages, code = "DE_APPROVED", text), LookUp(colMessages, code = "MSG_ERROR", text)), "PARTIAL", Coalesce(LookUp(colMessages, code = "DE_APPROVE_PARTIAL", text), LookUp(colMessages, code = "MSG_ERROR", text)), "REFUSED", Coalesce(LookUp(colMessages, code = "DE_APPROVE_REFUSED", text), LookUp(colMessages, code = "MSG_ERROR", text)), Coalesce(LookUp(colMessages, code = varDeAppr.messagecode, text), LookUp(colMessages, code = "MSG_ERROR", text))) & " (" & varDeAppr.correlationid & ")",
                Switch(varDeAppr.resultcode, "OK", NotificationType.Success, "PARTIAL", NotificationType.Warning, NotificationType.Error));

            Set(varBusy, true);
            Set(varDe, 'EFF-ReadDisciplineEffort'.Run(Text(varDePid)));
            Set(varBusy, false);
            If(varDe.ok = "true",
                Set(varDeScope, varDe.scope);
                Set(varDeCanEdit, Boolean(ParseJSON(varDe.caller).canEdit)); Set(varDeCanApprove, Boolean(ParseJSON(varDe.caller).canApprove));
                Set(varDeMyDisc, Text(ParseJSON(varDe.caller).disciplineCode));
                ClearCollect(colDeRows, ForAll(Table(ParseJSON(varDe.rows)), {id: Value(ThisRecord.Value.id), emp: Text(ThisRecord.Value.employeeName),
                    disc: Text(ThisRecord.Value.disciplineCode), wt: Value(ThisRecord.Value.workTypeId), wtLabel: Text(ThisRecord.Value.workTypeCode) & " – " & Text(ThisRecord.Value.workTypeName),
                    state: Text(ThisRecord.Value.state), value: Text(ThisRecord.Value.value), status: Text(ThisRecord.Value.status), etag: Text(ThisRecord.Value.etag),
                    mine: Boolean(ThisRecord.Value.mine)}));
                ClearCollect(colDeWts, ForAll(Table(ParseJSON(varDe.worktypes)), {id: Value(ThisRecord.Value.id), label: Text(ThisRecord.Value.code) & " – " & Text(ThisRecord.Value.name)}));
                ClearCollect(colDeMine, ForAll(colDeWts As w, {wt: w.id, label: w.label, active: true, value: Coalesce(LookUp(colDeRows, mine && wt = w.id).value, ""),
                    status: Coalesce(LookUp(colDeRows, mine && wt = w.id).status, "Draft"), etag: Coalesce(LookUp(colDeRows, mine && wt = w.id).etag, "")}));
                Collect(colDeMine, ForAll(Filter(colDeRows, mine && !(wt in colDeWts.id)) As r, {wt: r.wt, label: r.wtLabel, active: false, value: r.value,
                    status: r.status, etag: r.etag}));
                ClearCollect(colDeSum, ForAll(Table(ParseJSON(varDe.summary)), {code: Text(ThisRecord.Value.disciplineCode), name: Text(ThisRecord.Value.disciplineName),
                    cstate: Text(ThisRecord.Value.ceilingState), ceiling: Text(ThisRecord.Value.ceiling), used: Text(ThisRecord.Value.used),
                    remaining: Text(ThisRecord.Value.remaining), hours: Text(ThisRecord.Value.actualHours), mds: Text(ThisRecord.Value.actualManDays)}));
                ClearCollect(colDeSelTmp, Filter(colDeSel, id in Filter(colDeRows, status = "Draft").id)); ClearCollect(colDeSel, colDeSelTmp),
                Set(varDeCanEdit, false); Set(varDeCanApprove, false); Set(varDeScope, "none"); Clear(colDeRows); Clear(colDeWts); Clear(colDeMine); Clear(colDeSum);
                Clear(colDeSel);
                If(varDe.resultcode = "ROLE_NOT_ALLOWED", Set(varNoDe, true));
                Notify(If(varDe.resultcode = "ROLE_NOT_ALLOWED", Coalesce(LookUp(colMessages, code = "DE_NO_ACCESS", text), LookUp(colMessages, code = "MSG_ERROR", text)), Coalesce(LookUp(colMessages, code = varDe.messagecode, text), LookUp(colMessages, code = "MSG_ERROR", text))) & " (" & varDe.correlationid & ")", NotificationType.Error))
    - btnDeConfirmNo:
        Control: Classic/Button@2.2.0
        Properties:
          Text: ="No"
          X: =1240
          Y: =470
          Width: =80
          Height: =40
          Visible: =varDeConfirm
          OnSelect: =Set(varDeConfirm, false)
    - galDeTeam:
        Control: Gallery@2.15.0
        Variant: Vertical
        Properties:
          Items: =SortByColumns(colDeRows, "disc", SortOrder.Ascending, "emp", SortOrder.Ascending, "wt", SortOrder.Ascending)
          X: =700
          Y: =515
          Width: =Parent.Width - 720
          Height: =Parent.Height - 535
          TemplateSize: =45
          Visible: =!IsBlank(varDePid) && varDeScope <> "self"
        Children:
        - btnDeSel:
            Control: Classic/Button@2.2.0
            Properties:
              Text: =If(ThisItem.id in colDeSel.id, "[x]", "[ ]")
              X: =0
              Y: =5
              Width: =40
              Height: =35
              Visible: =varDeCanApprove && ThisItem.status = "Draft" && ThisItem.state = "VALUE" && ThisItem.disc = varDeMyDisc
              OnSelect: '=If(ThisItem.id in colDeSel.id, ClearCollect(colDeSelTmp, Filter(colDeSel, id <> ThisItem.id)); ClearCollect(colDeSel, colDeSelTmp), Collect(colDeSel, {id: ThisItem.id, etag: ThisItem.etag}))'
        - icoDeTeamLock:
            Control: Classic/Icon@2.5.0
            Properties:
              Icon: =Icon.Lock
              X: =8
              Y: =10
              Width: =24
              Height: =24
              Visible: =ThisItem.status = "ApprovedLocked"
              Tooltip: ="Đã phê duyệt"
              AccessibleLabel: ="Đã phê duyệt"
        - lblDeTeamRow:
            Control: Label@2.5.1
            Properties:
              X: =45
              Y: =5
              Width: =Parent.TemplateWidth - 245
              Height: =35
              Text: =ThisItem.disc & " · " & ThisItem.emp & " · " & ThisItem.wtLabel
        - lblDeTeamVal:
            Control: Label@2.5.1
            Properties:
              X: =Parent.TemplateWidth - 195
              Y: =5
              Width: =80
              Height: =35
              Align: =Align.Right
              Text: =If(ThisItem.state = "BLANK", "—", If(IsBlank(ThisItem.value), "", Text(Value(ThisItem.value), "#,##0.00")))
        - lblDeTeamRc:
            Control: Label@2.5.1
            Properties:
              X: =Parent.TemplateWidth - 110
              Y: =5
              Width: =110
              Height: =35
              Size: =10
              Text: '=With({rc: LookUp(colDeApprRes, id = ThisItem.id).rc}, If(IsBlank(rc) || rc = "OK", If(ThisItem.status = "ApprovedLocked", "đã duyệt", "nháp"), Coalesce(LookUp(colMessages, code = "MSG_"
                & rc, text), LookUp(colMessages, code = "MSG_ERROR", text))))'
